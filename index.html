<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Junior Astronaut: Artemis Moon Mission</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Full-Screen Live Space & Rocket Scene -->
  <canvas id="space-canvas"></canvas>

  <!-- Top Left: Mission Title & Phase -->
  <header class="hud-top-left">
    <h1>🚀 ARTEMIS MOON MISSION</h1>
    <div class="phase-badge" id="phase-badge">PHASE: PRE-LAUNCH</div>
  </header>

  <!-- Top Right: Single Mission Oxygen Timer -->
  <aside class="hud-top-right timer-panel" id="timer-panel">
    <div class="timer-title">🫧 OXYGEN / MISSION TIME</div>
    <div class="timer-display" id="main-timer">60s</div>
  </aside>

  <!-- Bottom HUD: Story, Rock Cards & Action Buttons -->
  <main class="hud-bottom">
    <div class="event-box">
      <span class="nasa-badge" id="nasa-tag">NASA ARTEMIS PROGRAM</span>
      <h2 id="event-title">Ready for Launch, Commander?</h2>
      <p id="event-desc">Complete pre-launch checks, collect the target lunar mineral, and return safely to Earth before your oxygen timer hits zero!</p>
    </div>

    <!-- Decision Buttons -->
    <div class="choices" id="choices-container">
      <button class="choice-btn" onclick="startMission()">Start Pre-Launch Prep 🚀</button>
    </div>
  </main>

  <script src="scenarios.js"></script>
  <script src="scene.js"></script>
  <script src="game.js"></script>
</body>
</html>
